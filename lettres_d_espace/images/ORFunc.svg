<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="195" height="212" viewBox="0 0 195 212" font-family="Verdana, Arial, Helvetica, sans-serif" font-size="13">
<title>La fonction OR : y = 1 dès qu'une entrée vaut 1</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrowblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
</defs>
<rect width="195" height="212" fill="#fff"/>
<line x1="40.0" y1="150.0" x2="182.0" y2="150.0" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="40.0" y1="150.0" x2="40.0" y2="18.0" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="180.0" y="168.0" text-anchor="end" fill="#222" font-style="italic">x<tspan font-size="10" dy="4">1</tspan><tspan dy="-4"> </tspan></text>
<text x="32.0" y="28.0" text-anchor="end" fill="#222" font-style="italic">x<tspan font-size="10" dy="4">2</tspan><tspan dy="-4"> </tspan></text>
<text x="40.0" y="168.0" text-anchor="middle" fill="#222" font-size="11">0</text><text x="140.0" y="168.0" text-anchor="middle" fill="#222" font-size="11">1</text><text x="30.0" y="54.0" text-anchor="end" fill="#222" font-size="11">1</text>
<line x1="140.0" y1="146.0" x2="140.0" y2="154.0" stroke="#222" stroke-width="1"/><line x1="36.0" y1="50.0" x2="44.0" y2="50.0" stroke="#222" stroke-width="1"/>
<circle cx="40" cy="150" r="8" fill="#d0392b"/>
<text x="52.0" y="141.0" text-anchor="start" fill="#d0392b" font-size="11" font-weight="bold">0</text>
<circle cx="140" cy="150" r="8" fill="#2a9a46"/>
<text x="152.0" y="141.0" text-anchor="start" fill="#2a9a46" font-size="11" font-weight="bold">1</text>
<circle cx="40" cy="50" r="8" fill="#2a9a46"/>
<text x="52.0" y="41.0" text-anchor="start" fill="#2a9a46" font-size="11" font-weight="bold">1</text>
<circle cx="140" cy="50" r="8" fill="#2a9a46"/>
<text x="152.0" y="41.0" text-anchor="start" fill="#2a9a46" font-size="11" font-weight="bold">1</text>
<circle cx="38" cy="196" r="6" fill="#2a9a46"/><text x="48.0" y="200.0" text-anchor="start" fill="#222" font-size="11">y = 1</text>
<circle cx="108" cy="196" r="6" fill="#d0392b"/><text x="118.0" y="200.0" text-anchor="start" fill="#222" font-size="11">y = 0</text>
</svg>
