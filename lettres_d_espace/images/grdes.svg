<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="258" viewBox="0 0 320 258" font-family="Verdana, Arial, Helvetica, sans-serif" font-size="13">
<title>La pente d'une courbe en un point P : Δy sur Δx</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrowblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
</defs>
<rect width="320" height="258" fill="#fff"/>
<line x1="40.0" y1="235.0" x2="310.0" y2="235.0" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="40.0" y1="235.0" x2="40.0" y2="15.0" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="308.0" y="253.0" text-anchor="end" fill="#222" font-style="italic">x</text>
<text x="32.0" y="25.0" text-anchor="end" fill="#222" font-style="italic">y</text>
<path d="M 50,78 Q 170,322 290,78" fill="none" stroke="#1f5fbf" stroke-width="2.2"/>
<line x1="198.0" y1="208.3" x2="288.0" y2="101.2" stroke="#d0392b" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="212.0" y1="191.7" x2="268.0" y2="191.7" stroke="#d0392b" stroke-width="1.4"/>
<line x1="268.0" y1="191.7" x2="268.0" y2="125.0" stroke="#d0392b" stroke-width="1.4"/>
<text x="240.0" y="207.7" text-anchor="middle" fill="#d0392b" font-size="12">Δx</text>
<text x="274.0" y="162.3" text-anchor="start" fill="#d0392b" font-size="12">Δy</text>
<circle cx="240" cy="158.3" r="4.5" fill="#222"/>
<text x="232.0" y="152.3" text-anchor="end" fill="#222" font-weight="bold">P</text>
<text x="58.0" y="34.0" text-anchor="start" fill="#222" font-size="13">pente en P = Δy / Δx</text>
</svg>
