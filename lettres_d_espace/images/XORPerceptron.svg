<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="525" height="388" viewBox="0 0 525 388" font-family="Verdana, Arial, Helvetica, sans-serif" font-size="13">
<title>Un perceptron avec une porte AND qui calcule XOR</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrowblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
</defs>
<rect width="525" height="388" fill="#fff"/>
<circle cx="180" cy="140" r="32" fill="#eef3fd" stroke="#1f5fbf" stroke-width="2"/><text x="180.0" y="145.0" text-anchor="middle" fill="#222" font-size="12">a = −0.5</text>
<line x1="180.0" y1="108.0" x2="180.0" y2="57.0" stroke="#1f5fbf" stroke-width="1.5" marker-end="url(#arrowblue)"/>
<rect x="146" y="27" width="68" height="26" rx="3" fill="#f2f2f2" stroke="#222" stroke-width="1.2"/><text x="180.0" y="45.0" text-anchor="middle" fill="#222" font-size="12">y = 0</text>
<rect x="266" y="317" width="68" height="26" rx="3" fill="#f2f2f2" stroke="#222" stroke-width="1.2"/><text x="300.0" y="335.0" text-anchor="middle" fill="#222" font-size="12">x<tspan font-size="10" dy="3">1</tspan><tspan dy="-3"> = 1</tspan></text>
<rect x="26" y="317" width="68" height="26" rx="3" fill="#f2f2f2" stroke="#222" stroke-width="1.2"/><text x="60.0" y="335.0" text-anchor="middle" fill="#222" font-size="12">x<tspan font-size="10" dy="3">2</tspan><tspan dy="-3"> = 1</tspan></text>
<rect x="11" y="127" width="68" height="26" rx="3" fill="#f2f2f2" stroke="#222" stroke-width="1.2"/><text x="45.0" y="145.0" text-anchor="middle" fill="#222" font-size="12">−1</text>
<line x1="288.0" y1="317.0" x2="205.0" y2="161.0" stroke="#1f5fbf" stroke-width="1.6"/>
<line x1="72.0" y1="317.0" x2="155.0" y2="161.0" stroke="#1f5fbf" stroke-width="1.6"/>
<line x1="79.0" y1="140.0" x2="147.0" y2="140.0" stroke="#1f5fbf" stroke-width="1.6"/>
<path d="M 162,280 L 162,258 A 18,18 0 0,1 198,258 L 198,280 z" fill="#eef3fd" stroke="#1f5fbf" stroke-width="1.8"/>
<text x="180.0" y="272.0" text-anchor="middle" fill="#222" font-size="10" font-weight="bold">AND</text>
<polyline points="94,330 172,330 172,280" fill="none" stroke="#222" stroke-width="1.3"/>
<polyline points="266,330 188,330 188,280" fill="none" stroke="#222" stroke-width="1.3"/>
<line x1="180.0" y1="240.0" x2="180.0" y2="173.0" stroke="#1f5fbf" stroke-width="1.6"/>
<text x="188.0" y="214.0" text-anchor="start" fill="#222" font-size="12" font-style="italic">−2</text>
<text x="262.0" y="205.0" text-anchor="start" fill="#222" font-size="12" font-style="italic">w<tspan font-size="10" dy="4">1</tspan><tspan dy="-4"> </tspan>= 1</text>
<text x="98.0" y="205.0" text-anchor="end" fill="#222" font-size="12" font-style="italic">w<tspan font-size="10" dy="4">2</tspan><tspan dy="-4"> </tspan>= 1</text>
<text x="112.0" y="130.0" text-anchor="middle" fill="#222" font-size="12" font-style="italic">u = 0.5</text>
<text x="385.0" y="70.0" text-anchor="start" fill="#222" font-size="12" font-style="italic">x<tspan font-size="9" dy="4">1</tspan><tspan dy="-4"> </tspan></text><text x="409.0" y="70.0" text-anchor="start" fill="#222" font-size="12" font-style="italic">x<tspan font-size="9" dy="4">2</tspan><tspan dy="-4"> </tspan></text><text x="467.0" y="70.0" text-anchor="end" fill="#222" font-size="12" font-style="italic">a</text><text x="495.0" y="70.0" text-anchor="start" fill="#222" font-size="12" font-style="italic">y</text>
<line x1="385.0" y1="78.0" x2="510.0" y2="78.0" stroke="#222" stroke-width="1"/>
<text x="388.0" y="96.0" text-anchor="start" fill="#222" font-size="12">0</text><text x="412.0" y="96.0" text-anchor="start" fill="#222" font-size="12">0</text><text x="467.0" y="96.0" text-anchor="end" fill="#222" font-size="12">−0.5</text><text x="495.0" y="96.0" text-anchor="start" fill="#d0392b" font-size="12" font-weight="bold">0</text>
<text x="388.0" y="116.0" text-anchor="start" fill="#222" font-size="12">0</text><text x="412.0" y="116.0" text-anchor="start" fill="#222" font-size="12">1</text><text x="467.0" y="116.0" text-anchor="end" fill="#222" font-size="12">+0.5</text><text x="495.0" y="116.0" text-anchor="start" fill="#2a9a46" font-size="12" font-weight="bold">1</text>
<text x="388.0" y="136.0" text-anchor="start" fill="#222" font-size="12">1</text><text x="412.0" y="136.0" text-anchor="start" fill="#222" font-size="12">0</text><text x="467.0" y="136.0" text-anchor="end" fill="#222" font-size="12">+0.5</text><text x="495.0" y="136.0" text-anchor="start" fill="#2a9a46" font-size="12" font-weight="bold">1</text>
<text x="388.0" y="156.0" text-anchor="start" fill="#222" font-size="12">1</text><text x="412.0" y="156.0" text-anchor="start" fill="#222" font-size="12">1</text><text x="467.0" y="156.0" text-anchor="end" fill="#222" font-size="12">−0.5</text><text x="495.0" y="156.0" text-anchor="start" fill="#d0392b" font-size="12" font-weight="bold">0</text>
<text x="385.0" y="196.0" text-anchor="start" fill="#222" font-size="11">XOR : 1 quand une</text>
<text x="385.0" y="211.0" text-anchor="start" fill="#222" font-size="11">seule entrée vaut 1</text>
<text x="180.0" y="372.0" text-anchor="middle" fill="#222" font-size="12">a = 1 + 1 − 2 − 0.5 = −0.5 &lt; 0  ⇒  y = 0</text>
</svg>
