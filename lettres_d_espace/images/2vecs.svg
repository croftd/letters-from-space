<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="310" height="212" viewBox="0 0 310 212" font-family="Verdana, Arial, Helvetica, sans-serif" font-size="13">
<title>Les vecteurs v = (1, 1) et w = (2, 0), à 45 degrés</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrowblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
</defs>
<rect width="310" height="212" fill="#fff"/>
<line x1="40.0" y1="180.0" x2="290.0" y2="180.0" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="40.0" y1="180.0" x2="40.0" y2="18.0" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="288.0" y="198.0" text-anchor="end" fill="#222" font-style="italic">x<tspan font-size="10" dy="4">1</tspan><tspan dy="-4"> </tspan></text>
<text x="32.0" y="28.0" text-anchor="end" fill="#222" font-style="italic">x<tspan font-size="10" dy="4">2</tspan><tspan dy="-4"> </tspan></text>
<line x1="40.0" y1="180.0" x2="142.0" y2="78.0" stroke="#1f5fbf" stroke-width="2.6" marker-end="url(#arrowblue)"/>
<line x1="40.0" y1="179.0" x2="246.0" y2="179.0" stroke="#1f5fbf" stroke-width="2.6" marker-end="url(#arrowblue)"/>
<path d="M 82,180 A 42,42 0 0,0 69.7,150.3" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="90.0" y="166.0" text-anchor="start" fill="#222" font-size="12">45°</text>
<text x="153.0" y="71.0" text-anchor="start" fill="#222" font-size="13"><tspan font-weight="bold">v</tspan> = (1, 1)</text>
<text x="192.2" y="168.0" text-anchor="middle" fill="#222" font-size="13"><tspan font-weight="bold">w</tspan> = (2, 0)</text>
<line x1="145.0" y1="176.0" x2="145.0" y2="184.0" stroke="#222" stroke-width="1"/><text x="145.0" y="197.0" text-anchor="middle" fill="#222" font-size="11">1</text>
<line x1="250.0" y1="181.0" x2="250.0" y2="186.0" stroke="#222" stroke-width="1"/><text x="250.0" y="197.0" text-anchor="middle" fill="#222" font-size="11">2</text>
<line x1="36.0" y1="75.0" x2="44.0" y2="75.0" stroke="#222" stroke-width="1"/><text x="32.0" y="79.0" text-anchor="end" fill="#222" font-size="11">1</text>
</svg>
